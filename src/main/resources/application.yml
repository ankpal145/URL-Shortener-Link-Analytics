server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  ip-hash-salt: ${APP_IP_HASH_SALT:local-dev-only-change-me}
  short-code:
    length: 7
    max-collision-retries: 5
  alias:
    pattern: "^[A-Za-z0-9_-]{3,32}$"
  reserved-paths:
    - shorten
    - stats
    - health
    - actuator
    - error
    - favicon.ico

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/urlshortener;AUTO_SERVER=TRUE;MODE=LEGACY}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    com.urlshortener: DEBUG
